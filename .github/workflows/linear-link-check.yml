# Reusable workflow: fails PRs that are not linked to a Linear issue.
# Repos call it via the "Linear link check" starter workflow. The pull_request
# trigger lets it also run directly as an org ruleset "required workflow".
name: Linear link check

on:
  workflow_call:
    inputs:
      team-keys:
        description: Comma-separated Linear team keys. Empty accepts any issue key.
        type: string
        default: ARV
      target-branches:
        description: Comma-separated base branches to enforce on.
        type: string
        default: main
      skip-label:
        description: PR label that exempts the PR.
        type: string
        default: no-ticket
      enforce:
        description: When false, report a warning instead of failing.
        type: boolean
        default: true
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  linear-link:
    name: linear-link
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Check out the action and run it as a local action. A remote
      # `uses: ...@main` would be downloaded when the job starts, even for a
      # skipped step. In arvion-ai/.github itself this checks out the PR, so
      # changes to the action are tested before they reach main; in every other
      # repo it checks out main.
      - name: Check out the action
        uses: actions/checkout@v7
        with:
          repository: arvion-ai/.github
          ref: ${{ github.repository == 'arvion-ai/.github' && github.sha || 'main' }}
          path: .linear-link-check
          sparse-checkout: actions/linear-link-check
          persist-credentials: false

      # The inputs context is only populated under workflow_call, where enforce
      # is always true or false. Under a direct pull_request trigger it is null,
      # so fall back to the action's own defaults rather than passing empty strings.
      - name: Check Linear link
        if: toJSON(inputs.enforce) != 'null'
        uses: ./.linear-link-check/actions/linear-link-check
        with:
          team-keys: ${{ inputs.team-keys }}
          target-branches: ${{ inputs.target-branches }}
          skip-label: ${{ inputs.skip-label }}
          enforce: ${{ inputs.enforce }}
      - name: Check Linear link (defaults)
        if: toJSON(inputs.enforce) == 'null'
        uses: ./.linear-link-check/actions/linear-link-check
